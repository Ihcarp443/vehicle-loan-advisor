
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vehicle-loan-backend
    env_file:
      - .env
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBED_MODEL: ${EMBED_MODEL:-gemini-embedding-001}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - processed_data:/app/data/processed
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vehicle-loan-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  processed_data:
